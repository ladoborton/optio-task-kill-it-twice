# Fixed project name: verify finds containers by the compose project label.
name: kill-it-twice

x-verify-env: &verify-env
  DATABASE_URL: postgres://optio:optio@postgres:5432/optio
  ES_URL: http://elasticsearch:9200
  RABBITMQ_MGMT_URL: http://rabbitmq:15672
  RABBITMQ_USER: optio
  RABBITMQ_PASSWORD: optio
  COMPOSE_PROJECT: kill-it-twice
  SEED_COUNT: ${SEED_COUNT:-1000000}
  API_URL: http://api:3000
  PIPELINE_METRICS_URL: http://pipeline:9100/metrics

# Every server role builds the same Dockerfile. No shared `image:` name on purpose (D-009): without a
# build cache Compose builds the five services in parallel, and five builds exporting one tag race
# ("image already exists"). BuildKit still builds the layers once; the five images share them.
x-server: &server
  build:
    context: .
    dockerfile: apps/server/Dockerfile

x-server-env: &server-env
  DATABASE_URL: postgres://optio:optio@postgres:5432/optio
  ES_URL: http://elasticsearch:9200
  RABBITMQ_URL: amqp://optio:optio@rabbitmq:5672
  SEED_COUNT: ${SEED_COUNT:-1000000}

services:
  # One-shot: applies migrations, then exits; roles depend on it (SPEC §5.1).
  migrate:
    <<: *server
    environment:
      <<: *server-env
      ROLE: migrate
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  # Backfill (+ incremental from S4). The service verify kills (SPEC §5.1).
  pipeline:
    <<: *server
    environment:
      <<: *server-env
      ROLE: pipeline
      # Heap below the container limit, so V8 collects before the kernel OOM-kills.
      NODE_OPTIONS: --max-old-space-size=192
    # SPEC §4.8: loading the whole table would need ~1 GB — with 256 MB it crashes instead.
    mem_limit: 256m
    depends_on:
      migrate: { condition: service_completed_successfully }
      elasticsearch: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    ports:
      - "9100:9100" # /metrics (Prometheus)
    # No automatic restart: verify plays the orchestrator and restarts it explicitly (G1),
    # so "resumed from" is measured against a checkpoint that cannot move in between.
    restart: "no"

  # HTTP for the UI and verify: status, data, control, simulation (SPEC §9).
  api:
    <<: *server
    environment:
      <<: *server-env
      ROLE: api
      COMPOSE_PROJECT: kill-it-twice
    ports:
      - "3000:3000"
    volumes:
      # Simulation (stop/start/kill sinks from the UI). DEV ONLY — see SPEC §9.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      migrate: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
    restart: unless-stopped

  # SPEC §10: Vue UI served by nginx, which proxies /api to the api service.
  ui:
    build:
      context: .
      dockerfile: apps/ui/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

  # Independent stream consumer with its own projection (SPEC §5.1, §6.3). Killed by G2.
  consumer:
    <<: *server
    environment:
      <<: *server-env
      ROLE: consumer
    depends_on:
      migrate: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
    restart: "no"

  # One-shot: `./seed.sh` — 1M deterministic customers, resets pipeline state (SPEC §4.8).
  seed:
    <<: *server
    profiles: [tools]
    environment:
      <<: *server-env
      ROLE: seed
    depends_on:
      migrate: { condition: service_completed_successfully }
      elasticsearch: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: optio
      POSTGRES_PASSWORD: optio
      POSTGRES_DB: optio
    # Larger WAL budget so the 1M-row seed doesn't spend its time checkpointing.
    command: postgres -c shared_buffers=256MB -c max_wal_size=2GB
    ports:
      - "5433:5432" # 5433 on the host: avoids clashing with a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U optio -d optio"]
      interval: 2s
      timeout: 3s
      retries: 30

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      # Dev laptop: a nearly full disk must not flip indices to read-only mid-verify.
      cluster.routing.allocation.disk.threshold_enabled: "false"
      # A write to a deleted index must fail, not silently recreate it without the strict
      # mapping (SPEC §4.5). Only the pipeline creates the index, with its mapping.
      action.auto_create_index: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    mem_limit: 2g
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=2s' >/dev/null"]
      interval: 3s
      timeout: 5s
      retries: 60

  rabbitmq:
    image: rabbitmq:4.0-management
    # Stable hostname = stable node name = data survives container re-creation.
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: optio
      RABBITMQ_DEFAULT_PASS: optio
    ports:
      - "5672:5672"
      - "15672:15672" # management UI
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 3s
      timeout: 5s
      retries: 40

  # One-shot gate runner: `./verify.sh [preflight|G1..G5]` (SPEC §11).
  verify:
    profiles: [tools]
    build:
      context: .
      dockerfile: verify/Dockerfile
    environment: *verify-env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

volumes:
  pgdata:
  esdata:
  rabbitdata:
